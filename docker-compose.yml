# =============================================================================
#  Cotizador Concrehaus — stack de producción
#
#  Pensado para correr en un VPS propio detrás de Nginx Proxy Manager (NPM).
#  NPM vive por fuera de este compose (en su propia red) y publica el puerto
#  del servicio `web` hacia Internet con su certificado TLS. Aquí NADA se expone
#  directo a Internet salvo lo que se enlaza a la red `npm` externa.
#
#  Puesta en marcha:
#    1. cp .env.example .env   # y completar los secretos
#    2. Crear la red de NPM si no existe:  docker network create npm
#    3. docker compose up -d
#    4. En NPM: Proxy Host → Forward a  web:3000  (dentro de la red `npm`)
#
#  Las imágenes de `web` y `worker` las publica el workflow de GitHub Actions en
#  GHCR. En el VPS se consumen con `docker compose pull && up -d` — no hace falta
#  compilar en el servidor. Para buildear localmente, usar docker-compose.build.yml.
# =============================================================================

x-restart: &restart
  restart: unless-stopped

services:
  # ---------------------------------------------------------------- Frontend
  web:
    image: ${REGISTRY:-ghcr.io/pel-matiasvaldivia/concrehaus}/web:${TAG:-latest}
    <<: *restart
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://concrehaus:${POSTGRES_PASSWORD}@postgres:5432/concrehaus
      REDIS_URL: redis://redis:6379
      # Dominios habilitados para Server Actions detrás del proxy (coma-separados).
      ALLOWED_ORIGINS: ${PUBLIC_ORIGIN}
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: ${S3_BUCKET:-planos}
      S3_ACCESS_KEY: ${MINIO_ROOT_USER}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal
      - npm            # <- red externa de Nginx Proxy Manager
    expose:
      - "3000"

  # ------------------------------------------------------------------ Worker
  worker:
    image: ${REGISTRY:-ghcr.io/pel-matiasvaldivia/concrehaus}/worker:${TAG:-latest}
    <<: *restart
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://concrehaus:${POSTGRES_PASSWORD}@postgres:5432/concrehaus
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: ${S3_BUCKET:-planos}
      S3_ACCESS_KEY: ${MINIO_ROOT_USER}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-2}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal

  # --------------------------------------------------------------- PostgreSQL
  postgres:
    image: postgres:17-alpine
    <<: *restart
    environment:
      POSTGRES_USER: concrehaus
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: concrehaus
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U concrehaus -d concrehaus"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  # -------------------------------------------------------------------- Redis
  redis:
    image: redis:7-alpine
    <<: *restart
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  # ---------------------------------------------- Storage S3 (planos privados)
  minio:
    image: minio/minio:latest
    <<: *restart
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - internal
      - npm            # opcional: publicar la consola de MinIO vía NPM
    expose:
      - "9000"
      - "9001"

  # ------------------- Crea el bucket de planos la primera vez y termina -----
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD} &&
      mc mb --ignore-existing local/$${S3_BUCKET} &&
      mc anonymous set none local/$${S3_BUCKET} &&
      echo 'bucket listo';
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET: ${S3_BUCKET:-planos}
    networks:
      - internal
    restart: "no"

volumes:
  pgdata:
  redisdata:
  miniodata:

networks:
  internal:
    driver: bridge
  npm:
    external: true
